name: Build & Deploy para Hostinger

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Build de Produção
        run: npm run build

      # Se o usuário configurar os Secrets FTP da Hostinger no GitHub (opcional e recomendado):
      # Secrets: HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD
      - name: Deploy via FTP para Hostinger (se secrets configurados)
        if: env.HOSTINGER_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
